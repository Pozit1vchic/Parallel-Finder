<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Parallel Finder — две временные последовательности движения</title>
  <desc id="desc">Два кадра A и B с похожими траекториями движения, связанными временной шкалой.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0c0d0b"/>
      <stop offset="1" stop-color="#171914"/>
    </linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d97757"/>
      <stop offset="1" stop-color="#f0a078"/>
    </linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7c9885"/>
      <stop offset="1" stop-color="#b2cfbc"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="430" fill="url(#canvas)"/>
  <g fill="none" stroke="#2a2d27" stroke-width="1">
    <path d="M0 72H1200M0 144H1200M0 216H1200M0 288H1200M0 360H1200"/>
    <path d="M120 0V430M240 0V430M360 0V430M480 0V430M600 0V430M720 0V430M840 0V430M960 0V430M1080 0V430"/>
  </g>
  <text x="62" y="57" fill="#e7e4da" font-family="Georgia, serif" font-size="29">Два движения. Один монтажный ритм.</text>
  <text x="64" y="83" fill="#9ca39a" font-family="Segoe UI, Arial, sans-serif" font-size="14">Parallel Finder сопоставляет движение во времени, сценах и источниках.</text>
  <g transform="translate(62 118)">
    <rect width="445" height="192" rx="13" fill="#10120f" stroke="#d97757" stroke-width="2"/>
    <text x="22" y="33" fill="#f0a078" font-family="Georgia, serif" font-size="22">A</text>
    <text x="365" y="32" fill="#9ca39a" font-family="Segoe UI, Arial, sans-serif" font-size="12">00:01:42</text>
    <path d="M86 143C136 96 178 164 221 119S306 87 361 129" fill="none" stroke="url(#a)" stroke-width="4" filter="url(#glow)"/>
    <g fill="#f0a078">
      <circle cx="86" cy="143" r="6"/><circle cx="151" cy="116" r="6"/><circle cx="221" cy="119" r="6"/><circle cx="292" cy="99" r="6"/><circle cx="361" cy="129" r="6"/>
    </g>
    <path d="M28 168H417" stroke="#31352d" stroke-width="5" stroke-linecap="round"/>
    <path d="M96 168H268" stroke="#d97757" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g transform="translate(693 118)">
    <rect width="445" height="192" rx="13" fill="#10120f" stroke="#7c9885" stroke-width="2"/>
    <text x="22" y="33" fill="#b2cfbc" font-family="Georgia, serif" font-size="22">B</text>
    <text x="365" y="32" fill="#9ca39a" font-family="Segoe UI, Arial, sans-serif" font-size="12">00:03:08</text>
    <path d="M84 142C139 104 182 162 222 118S308 91 364 130" fill="none" stroke="url(#b)" stroke-width="4" filter="url(#glow)"/>
    <g fill="#b2cfbc">
      <circle cx="84" cy="142" r="6"/><circle cx="151" cy="118" r="6"/><circle cx="222" cy="118" r="6"/><circle cx="293" cy="100" r="6"/><circle cx="364" cy="130" r="6"/>
    </g>
    <path d="M28 168H417" stroke="#31352d" stroke-width="5" stroke-linecap="round"/>
    <path d="M104 168H277" stroke="#7c9885" stroke-width="5" stroke-linecap="round"/>
  </g>
  <path d="M532 213H668" fill="none" stroke="#d9d4c7" stroke-width="2" stroke-dasharray="5 7"/>
  <circle cx="600" cy="213" r="23" fill="#191c17" stroke="#d9d4c7"/>
  <path d="M590 213l7 7 14-16" fill="none" stroke="#d9d4c7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(62 353)">
    <text fill="#e7e4da" font-family="Segoe UI, Arial, sans-serif" font-size="13">временное окно</text>
    <text x="222" fill="#e7e4da" font-family="Segoe UI, Arial, sans-serif" font-size="13">границы сцен</text>
    <text x="418" fill="#e7e4da" font-family="Segoe UI, Arial, sans-serif" font-size="13">трек человека</text>
    <text x="602" fill="#e7e4da" font-family="Segoe UI, Arial, sans-serif" font-size="13">внешность тела</text>
  </g>
  <path d="M62 381H1138" stroke="#31352d" stroke-width="2"/>
  <path d="M62 381H378" stroke="#d97757" stroke-width="2"/>
  <path d="M710 381H1138" stroke="#7c9885" stroke-width="2"/>
</svg>
